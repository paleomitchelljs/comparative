<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertebrate Muscle Homology &amp; Topology</title>
<meta name="description" content="Search vertebrate muscles for origin, insertion, action, innervation, taxonomic occurrence and homology hypotheses, sourced to the primary literature.">

    <h1 class="wordmark">Muscle Homology <span>&amp; Topology</span></h1>

    <div class="masthead-actions">
      <button class="ghost" id="btn-browse" aria-pressed="true">Muscles</button>

      <button class="ghost" id="btn-filters" title="Show or hide filters" aria-pressed="false">Filters</button>
      <button class="ghost" id="btn-theme" title="Toggle light/dark">◐</button>
    </div>
  </div>
</header>

<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main"><div class="empty">Loading data…</div></main>
